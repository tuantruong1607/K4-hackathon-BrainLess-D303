# Local development infrastructure only. Do not deploy these defaults to a
# networked environment; production services need managed authentication and TLS.
services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  neo4j:
    image: neo4j:5.26.28
    environment:
      NEO4J_AUTH: "${NEO4J_AUTH:?Set NEO4J_AUTH in agent/.env}"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  qdrant_data:
  neo4j_data:
